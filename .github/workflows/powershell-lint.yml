name: PSScriptAnalyzer

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning -Settings ./PSScriptAnalyzerSettings.psd1
          $root = (Get-Location).Path
          foreach ($r in $results) {
            $level = if ($r.Severity -eq 'Error') { 'error' } else { 'warning' }
            $rel = $r.ScriptPath.Substring($root.Length + 1) -replace '\\','/'
            Write-Output "::$level file=$rel,line=$($r.Line)::$($r.RuleName): $($r.Message)"
          }
          if ($results) {
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s)."
            exit 1
          } else {
            Write-Output "PSScriptAnalyzer: no issues found."
          }

